<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saka Nusantara - Arsitektur Kayu Tradisional & Simulasi Gempa</title>
  
  <link rel="stylesheet" href="style.css">
  
  <!-- CDN Blockly -->
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>

  <!-- CDN Three.js & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <!-- Header Banner Saka Nusantara -->
  <header class="main-header">
    <div class="header-left">
      <div class="logo-box logo-office" title="Logo Kantor">
        <img src="https://via.placeholder.com/45?text=Kantor" alt="Logo Kantor" id="officeLogo">
      </div>
      <div class="header-titles">
        <h1>🪵 Saka Nusantara</h1>
        <p class="subtitle">Logika Sambungan Kayu & Simulasi Arsitektur Tradisional</p>
      </div>
    </div>

    <div class="header-right">
      <div class="mascot-box" title="SiYO - Maskot Taman Numerasi">
        <span class="mascot-tag">Taman Numerasi</span>
        <img src="https://via.placeholder.com/50?text=SiYO" alt="SiYO Maskot" id="siyoMascot">
      </div>
    </div>
  </header>

  <div id="main-container">
    <!-- Area Workspace Blockly (Kiri - 55%) -->
    <div id="blocklyDiv"></div>

    <!-- Area Preview 3D Penuh (Kanan - 45%) -->
    <div id="rightPanel">
      <div id="canvas3DContainer">
        
        <!-- Toolbar Navigasi & Uji Gempa Ala Tinkercad -->
        <div class="tinkercad-toolbar">
          <button onclick="resetCameraHome()" title="Kembali ke Tampilan Awal (Home)">🏠</button>
          <button onclick="zoomInCamera()" title="Perbesar (Zoom In)">➕</button>
          <button onclick="zoomOutCamera()" title="Perkecil (Zoom Out)">➖</button>
          <hr class="toolbar-divider">
          <button id="btnQuake" onclick="toggleEarthquake()" title="Simulasi Uji Ketahanan Gempa">🫨 Uji Gempa</button>
        </div>

        <!-- Indicator Status Uji Gempa -->
        <div id="quakeStatus" class="quake-status-box">Status Bangunan: Kokoh (Siap Uji)</div>

        <!-- Legenda Workplane & Sumbu -->
        <div class="axes-legend">
          <span class="axis-item">🟦 Workplane</span>
          <span class="axis-item">🔴 X (Geser/Putar)</span>
          <span class="axis-item">🟢 Y (Tinggi)</span>
        </div>
      </div>
    </div>
  </div>

  <!-- XML Toolbox Definition -->
  <xml id="toolbox" style="display: none">
    <category name="1. Tambah Kayu / Benda Kerja" colour="#2e7d32">
      <block type="tambah_benda_kerja"></block>
    </category>
    <category name="2. Sambungan & Pahatan" colour="#0288d1">
      <block type="fungsi_sambungan"></block>
      <block type="teknik_sambungan"></block>
    </category>
    <category name="3. Transformasi (Geser & Putar)" colour="#f57c00">
      <block type="transformasi_posisi"></block>
      <block type="transformasi_rotasi"></block>
    </category>
  </xml>

  <!-- Skrip Aplikasi -->
  <script src="blockly-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
